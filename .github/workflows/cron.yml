name: Daily Cron Job

on:
  schedule:
    # 每天早上 8 点 (UTC) = 下午 4 点 (北京时间)
    - cron: '0 8 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PaperHub Cron API
        env:
          PAPERHUB_CRON_URL: https://paperhub-liart.vercel.app/api/cron
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -n "$CRON_SECRET" ]; then
            curl --fail --show-error --silent --retry 2 --retry-delay 5 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$PAPERHUB_CRON_URL"
          else
            curl --fail --show-error --silent --retry 2 --retry-delay 5 \
              "$PAPERHUB_CRON_URL"
          fi
